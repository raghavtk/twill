[package]
name = "twill"
version = "0.1.0"
edition = "2021"
description = "A small local text editor for Windows"
license = "MIT"

[dependencies]
anyhow = "1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
ropey = "1.6"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rfd = "0.15"
notify = "8"
portable-pty = "0.9"
vt100 = "0.15"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }

[build-dependencies]
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
